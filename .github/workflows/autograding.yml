name: Autograding Tests
on:
- push
- repository_dispatch

permissions:
  contents: read
  statuses: write

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: (github.event_name != 'push' || github.event.head_commit.message != 'Initial commit')
    env:
      CI: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      run: npm install
      timeout-minutes: 2

    - name: Disable man-db auto-update (prevents apt-get hangs)
      run: sudo rm -f /var/lib/man-db/auto-update

    - name: Install Chromium browser
      run: npx playwright install chromium --with-deps
      timeout-minutes: 2

    - name: Copy .env file
      run: cp .grading/.env.test .env

    - name: Run the example suite using autograder
      uses: ohjelmistokehitys/autograder@v0
      timeout-minutes: 3
      with:
        test_suite: ./.grading/config.json

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report
        retention-days: 30
